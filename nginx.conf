worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting Zone definition (Enterprise feature to prevent DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Microservice Upstream Definitions
    upstream auth_service {
        server auth-service:3000;
    }

    upstream booking_service {
        server booking-service:3000;
    }

    upstream inventory_service {
        server inventory-service:3000;
    }

    server {
        listen 80;
        server_name rownaa.com www.rownaa.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'" always;

        # Route Auth Traffic
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Booking Traffic
        location /api/bookings/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://booking_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Traffic (Socket.io)
        location /socket.io/ {
            proxy_pass http://booking_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Inventory Traffic
        location /api/inventory/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://inventory_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check for AWS / Load Balancers
        location /health {
            return 200 'healthy\n';
        }

        # Fallback for undefined routes
        location / {
            return 404 '{"error": "API Gateway: Route not found"}';
        }
    }
}
